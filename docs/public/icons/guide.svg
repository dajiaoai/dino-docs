  <path d="M24 13 L27.5 24 L24 27 L20.5 24 Z" fill="#a668b8"/>
  <path d="M24 35 L20.5 24 L24 27 L27.5 24 Z" fill="#01b88b" opacity="0.55"/>
  <!-- pivot -->
  <circle cx="24" cy="24" r="2" fill="white" fill-opacity="0.9"/>
  <circle cx="24" cy="24" r="2" stroke="#888" stroke-width="0.8"/>
</svg>
